t2i_pretrain:
  dataset_names:
  - t2i
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 256
  is_mandatory: False
  num_used_data: # The sum should be larger that NUM_GPUS x NUM_WORKERS
  - 640000
  weight: 0

